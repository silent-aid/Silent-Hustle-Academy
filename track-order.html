<!DOCTYPE html>
<html>
<head>
  <title>Track Order | MQ Threads</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin:0;
      background:#0e0e0e;
      color:white;
      font-family:Arial;
      display:flex;
    }
    .side {
      width:220px;
      background:black;
      display:flex;
      align-items:center;
      justify-content:center;
      border-right:1px solid #222;
    }
    .side img { width:120px; }
    .main { padding:40px; flex:1; max-width:600px; }
    input,button {
      width:100%;
      padding:10px;
      margin-top:10px;
    }
    button {
      background:white;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }
    .step {
      display:flex;
      align-items:center;
      margin-top:15px;
    }
    .dot {
      width:14px;
      height:14px;
      border-radius:50%;
      background:#555;
      margin-right:10px;
    }
    .done { background:#2ecc71; }
    .progress { background:#f1c40f; }
    .details p { margin:5px 0; color:#ccc; }
  </style>
</head>

<body>

<div class="side">
  <img src="logo.png" alt="MQ Threads">
</div>

<div class="main">
  <h2>Track Your Order</h2>
  <input id="oid" placeholder="Enter Order ID">
  <button onclick="track()">Track Order</button>

  <div id="result"></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
});

const db = firebase.firestore();

const steps = [
  "Design Selected",
  "Waiting for ₹100 Confirmation",
  "Printing",
  "Out for Delivery",
  "Delivered"
];

function track(){
  const id = oid.value;
  db.collection("orders").doc(id).get().then(doc=>{
    if(!doc.exists){
      result.innerHTML = "❌ Order not found";
      return;
    }

    const d = doc.data();
    let html = `
      <div class="details">
        <p><b>Name:</b> ${d.name}</p>
        <p><b>Product:</b> ${d.product}</p>
        <p><b>Size:</b> ${d.size}</p>
        <p><b>Color:</b> ${d.color}</p>
      </div>
      <hr>
    `;

    steps.forEach((s,i)=>{
      let c = i < d.step ? "done" : i === d.step ? "progress" : "";
      html += `<div class="step"><div class="dot ${c}"></div>${s}</div>`;
    });

    result.innerHTML = html;
  });
}
</script>

</body>
</html>
