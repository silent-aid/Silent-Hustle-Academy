<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Your Order | MQ Threads</title>
  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .step {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      margin-right: 15px;
      background: #555;
    }
    .done { background: #2ecc71; }
    .progress { background: #f1c40f; }
    .pending { background: #777; }

    .note {
      font-size: 12px;
      color: #bbb;
      margin-left: 33px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Order Tracking</h1>

  <div class="step">
    <div class="circle done"></div>
    <div>Design Selected</div>
  </div>

  <div class="step">
    <div class="circle progress"></div>
    <div>Waiting for ₹100 Confirmation Payment</div>
  </div>
  <div class="note">₹100 is non-refundable once production starts</div>

  <div class="step">
    <div class="circle pending"></div>
    <div>Printing in Progress</div>
  </div>

  <div class="step">
    <div class="circle pending"></div>
    <div>Out for Delivery (COD)</div>
  </div>

  <div class="step">
    <div class="circle pending"></div>
    <div>Delivered</div>
  </div>
</div>

</body>
</html>
