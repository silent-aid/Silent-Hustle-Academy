<!DOCTYPE html>
<html>
<head>
<title>MQ Threads | Track Order</title>

<style>
body{
  background:#0b0b0b;
  color:white;
  font-family:Arial;
}

.container{
  max-width:420px;
  margin:60px auto;
  background:#121212;
  padding:25px;
  border-radius:12px;
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}

button{
  background:#d4af37;
  color:black;
  font-weight:bold;
}

.step{
  display:flex;
  align-items:center;
  margin:12px 0;
}

.circle{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#444;
  margin-right:10px;
}

.active .circle{
  background:#d4af37;
  box-shadow:0 0 10px #d4af37;
}

.line{
  height:2px;
  background:#444;
  margin:6px 0 6px 7px;
}

.activeLine{
  background:#d4af37;
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">
    <img src="mq-logo.png" width="120">
  </div>

  <input id="orderId" placeholder="Enter Order ID">
  <button onclick="track()">Track Order</button>

  <div id="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"YOUR_KEY",
  projectId:"YOUR_PROJECT_ID"
});
const db=firebase.firestore();

const steps=[
"Design Selected",
"Waiting for Address",
"Address Received",
"Order Confirmed",
"Printing",
"Shipped",
"Out for Delivery",
"Delivered"
];

function track(){
  const id=document.getElementById("orderId").value;
  const box=document.getElementById("status");
  box.innerHTML="Loading...";

  db.collection("orders").doc(id).get().then(doc=>{
    if(!doc.exists){ box.innerHTML="Order not found"; return; }
    const s=doc.data().status;
    let html="";
    steps.forEach((t,i)=>{
      html+=`
      <div class="step ${s>i?'active':''}">
        <div class="circle"></div>${t}
      </div>`;
    });
    box.innerHTML=html;
  });
}
</script>

</body>
</html>
