<!DOCTYPE html>
<html>
<head>
  <title>MQ Threads Order Tracking</title>
  <style>
    body { font-family: Arial; background:#f7f7f7; }
    .box { max-width:400px; margin:auto; background:white; padding:20px; }
    .step { padding:8px; border-left:4px solid #ccc; margin:6px 0; }
    .active { border-color:black; font-weight:bold; }
  </style>
</head>
<body>

<div class="box">
  <img src="mq-logo.png" width="120"><br><br>

  <input id="orderId" placeholder="Enter Order ID">
  <button onclick="track()">Track</button>

  <div id="result"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const steps = [
  "Design Selected",
  "Waiting for Address",
  "Address Received",
  "Order Confirmed",
  "Printing",
  "Shipped",
  "Out for Delivery",
  "Delivered"
];

function track() {
  const id = document.getElementById("orderId").value;
  const res = document.getElementById("result");
  res.innerHTML = "Loading...";

  db.collection("orders").doc(id).get().then(doc => {
    if (!doc.exists) {
      res.innerHTML = "❌ Order not found";
      return;
    }

    const data = doc.data();
    let html = `<h3>${data.product}</h3><p>Name: ${data.name}</p>`;

    steps.forEach((s, i) => {
      html += `<div class="step ${data.status >= i+1 ? 'active' : ''}">
        ${s}
      </div>`;
    });

    res.innerHTML = html;
  });
}
</script>

</body>
</html>
