<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Checkout | MQ Threads</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Poppins,system-ui;
background:radial-gradient(circle at top,#000,#050505);
color:white;
margin:0;
padding:20px;
}

.marquee{
background:linear-gradient(90deg,#ff0000,#ff0066);
padding:10px;
text-align:center;
font-weight:600;
}

.container{max-width:720px;margin:30px auto;}

.card{
background:linear-gradient(180deg,#141414,#0d0d0d);
padding:26px;
border-radius:22px;
box-shadow:0 25px 60px rgba(0,0,0,.8);
margin-bottom:22px;
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.box{background:#1c1c1c;padding:14px;border-radius:14px;text-align:center;}

.price-grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
margin-top:12px;
}
.mrp{background:#2a2a2a}
.discount{background:linear-gradient(45deg,#ff0066,#ff9900)}
.total{background:linear-gradient(45deg,#00ff9d,#00ffaa);color:#000;font-weight:700}

label{display:block;margin-top:14px;font-weight:600}
input,textarea{
width:100%;
padding:12px;
margin-top:6px;
background:#1a1a1a;
color:white;
border:1px solid #333;
border-radius:10px;
}

.payment-box{
display:flex;
gap:12px;
margin-top:12px;
}
.pay-option{
flex:1;
background:#1a1a1a;
border:2px solid #333;
padding:16px;
border-radius:16px;
cursor:pointer;
text-align:center;
font-weight:600;
transition:.3s;
}
.pay-option.active{
border-color:#00ff9d;
background:#003326;
transform:scale(1.05);
}

.upi-info{
margin-top:12px;
padding:14px;
background:#000;
border-radius:14px;
border:1px dashed #00ff9d;
display:none;
text-align:center;
}

button{
margin-top:25px;
width:100%;
padding:18px;
background:linear-gradient(45deg,#00ff9d,#00ffaa);
border:none;
font-size:18px;
font-weight:700;
border-radius:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="marquee">
🔥 Free Delivery | Extra ₹50 OFF on UPI Payments
</div>

<div class="container">

<div class="card">
<h2 style="text-align:center">Order Summary</h2>

<div class="grid">
<div class="box">🧥 <b id="pName"></b></div>
<div class="box">🎨 Color: <b id="pColor"></b></div>
<div class="box">📦 Qty: <b id="pQty"></b></div>
<div class="box">🚚 Free Delivery</div>
</div>

<div class="price-grid">
<div class="box mrp">MRP<br>₹999</div>
<div class="box discount" id="discountBox">🔥 Discount<br>₹500</div>
<div class="box total">Total<br>₹<span id="pTotal"></span></div>
</div>
</div>

<div class="card">
<h2 style="text-align:center">Delivery Details</h2>

<form id="orderForm">
<label>Full Name<input type="text" name="name" required></label>
<label>Phone<input type="tel" name="phone" required></label>
<label>WhatsApp<input type="tel" name="whatsapp" required></label>
<label>City<input type="text" name="city" required></label>
<label>Full Address<textarea name="address" required></textarea></label>

<input type="hidden" name="product" id="productField">
<input type="hidden" name="qty" id="qtyField">
<input type="hidden" name="price" id="priceField">
<input type="hidden" name="color" id="colorField">
<input type="hidden" name="payment" id="paymentField">

<label>Payment Method</label>
<div class="payment-box">
<div class="pay-option" id="codBox">Cash on Delivery</div>
<div class="pay-option" id="upiBox">UPI (₹50 OFF)</div>
</div>

<div class="upi-info" id="upiInfo">
Pay using:<br><br>
📱 PhonePe<br>
📱 Google Pay<br>
📱 Paytm<br><br>
UPI ID: <b>9121783895@fam</b>
</div>

<button type="submit">Place Order</button>
</form>
</div>
</div>

<script>
let product = localStorage.getItem("product") || "Premium Hoodie";
let qty = parseInt(localStorage.getItem("qty") || 1);
let price = parseInt(localStorage.getItem("price") || 499);
let color = localStorage.getItem("color") || "Black";

let baseTotal = price * qty;
let finalTotal = baseTotal;

pName.innerText = product;
pQty.innerText = qty;
pColor.innerText = color;
pTotal.innerText = baseTotal;

productField.value = product;
qtyField.value = qty;
colorField.value = color;

let paymentMethod="";

function updateTotal(){
pTotal.innerText = finalTotal;
priceField.value = finalTotal;
}

codBox.onclick=()=>{
paymentMethod="COD";
codBox.classList.add("active");
upiBox.classList.remove("active");
upiInfo.style.display="none";
finalTotal = baseTotal;
discountBox.innerHTML="🔥 Discount<br>₹500";
updateTotal();
paymentField.value="COD";
}

upiBox.onclick=()=>{
paymentMethod="UPI";
upiBox.classList.add("active");
codBox.classList.remove("active");
upiInfo.style.display="block";
finalTotal = baseTotal - 50;
discountBox.innerHTML="🔥 Discount<br>₹550";
updateTotal();
paymentField.value="UPI";
}

orderForm.addEventListener("submit",e=>{
e.preventDefault();
if(!paymentMethod){alert("Select payment method");return;}

fetch("https://script.google.com/macros/s/AKfycbxisICLhzPNqqXPnFdBcAZkiz2iuLvmoIy-kvbzXf5e4JtVyr7jKpuUldWQT9iWlex4/exec",{
method:"POST",
body:new FormData(orderForm)
})
.then(()=>window.location.href="thank-you.html")
.catch(()=>alert("Order failed"));
});
</script>

</body>
</html>
