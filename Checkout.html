<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | MQ Threads</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:system-ui, -apple-system, sans-serif;
  background:#0b0b0b;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:12px;
}
.card{
  background:#141414;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}
h2{font-size:17px;margin:6px 0 10px;}

.option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border:2px solid #333;
  border-radius:10px;
  margin:8px 0;
}
.option.active{
  border-color:#00ff99;
  background:#0f1f1a;
}

input,select,textarea{
  width:100%;
  padding:11px;
  margin:6px 0;
  border-radius:8px;
  border:none;
  background:#1f1f1f;
  color:#fff;
  font-size:14px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#00ff99;
  color:#000;
  font-size:16px;
  font-weight:600;
}

.green{color:#00ff99;}
.small{font-size:13px;color:#aaa;}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>Order Summary</h2>
<p>Premium Hoodie – MQ Threads</p>
<p id="priceText">Price: ₹499</p>
<p id="discountText" class="green" style="display:none;">UPI Discount: -₹50</p>
</div>

<div class="card">
<h2>Payment Method</h2>

<div class="option active" id="cod" onclick="setPay('cod')">
<i class="fa-solid fa-truck"></i> Cash on Delivery
</div>

<div class="option" id="upi" onclick="setPay('upi')">
<i class="fa-solid fa-mobile"></i> UPI (PhonePe / GPay / Paytm)
<span class="green small">(₹50 OFF)</span>
</div>
</div>

<div class="card">
<h2>Shipping Details</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<input id="email" placeholder="Email (optional)">

<select id="state">
<option value="">Select State</option>
<option>Andhra Pradesh</option>
<option>Arunachal Pradesh</option>
<option>Assam</option>
<option>Bihar</option>
<option>Chhattisgarh</option>
<option>Goa</option>
<option>Gujarat</option>
<option>Haryana</option>
<option>Himachal Pradesh</option>
<option>Jharkhand</option>
<option>Karnataka</option>
<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Maharashtra</option>
<option>Manipur</option>
<option>Meghalaya</option>
<option>Mizoram</option>
<option>Nagaland</option>
<option>Odisha</option>
<option>Punjab</option>
<option>Rajasthan</option>
<option>Sikkim</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Tripura</option>
<option>Uttar Pradesh</option>
<option>Uttarakhand</option>
<option>West Bengal</option>
<option>Delhi</option>
<option>Jammu & Kashmir</option>
<option>Ladakh</option>
<option>Puducherry</option>
<option>Chandigarh</option>
<option>Dadra & Nagar Haveli</option>
<option>Daman & Diu</option>
<option>Lakshadweep</option>
<option>Andaman & Nicobar</option>
</select>

<textarea id="address" placeholder="Full Address"></textarea>

<button onclick="placeOrder()">Order Now</button>
</div>

</div>

<script>
let payment="cod";
let price=499;

function setPay(type){
  payment=type;
  document.getElementById("cod").classList.remove("active");
  document.getElementById("upi").classList.remove("active");

  if(type==="upi"){
    document.getElementById("upi").classList.add("active");
    price=449;
    discountText.style.display="block";
  }else{
    document.getElementById("cod").classList.add("active");
    price=499;
    discountText.style.display="none";
  }
  priceText.innerText="Price: ₹"+price;
}

function placeOrder(){
  let n=name.value;
  let p=phone.value;
  let s=state.value;

  if(!n||!p||!s){
    alert("Please fill all required fields");
    return;
  }

  if(payment==="upi"){
    let upi="9121783895@fam";
    let url=`upi://pay?pa=${upi}&pn=MQ%20Threads&am=${price}&cu=INR`;
    window.location.href=url;

    // fallback if browser blocks
    setTimeout(()=>{
      window.location.href="thankyou.html";
    },2500);
  }else{
    window.location.href="thankyou.html";
  }
}
</script>
</body>
</html>
