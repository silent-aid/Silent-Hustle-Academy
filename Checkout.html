<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout | MQ Threads</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin:0;
  font-family: 'Poppins', sans-serif;
  background:#0b0b0b;
  color:#fff;
}

.container {
  max-width:480px;
  margin:auto;
  padding:20px;
}

.card {
  background:#141414;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 0 25px rgba(255,255,255,0.05);
}

h2 {margin-bottom:10px;}

.payment-option {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border:2px solid #333;
  border-radius:12px;
  margin:10px 0;
  cursor:pointer;
  transition:0.3s;
}

.payment-option.active {
  border-color:#00ff99;
  background:#0f1f1a;
}

.payment-option i {
  font-size:26px;
}

.discount {
  color:#00ff99;
  font-size:14px;
}

input, select, textarea {
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  outline:none;
  background:#1f1f1f;
  color:#fff;
}

button {
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,#00ff99,#00ccff);
  border:none;
  border-radius:14px;
  color:#000;
  font-size:18px;
  font-weight:600;
  margin-top:15px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>Order Summary</h2>
<p>Premium Hoodie – MQ Threads</p>
<p id="priceText">Price: ₹499</p>
</div>

<div class="card">
<h2>Payment Method</h2>

<div class="payment-option active" onclick="selectPayment('cod')" id="codBox">
<i class="fa-solid fa-truck"></i>
Cash on Delivery
</div>

<div class="payment-option" onclick="selectPayment('upi')" id="upiBox">
<i class="fa-solid fa-credit-card"></i>
UPI / Online Payment  
<span class="discount">(₹50 OFF)</span>
</div>
</div>

<div class="card">
<h2>Shipping Details</h2>
<input type="text" id="name" placeholder="Full Name" required>
<input type="tel" id="phone" placeholder="Phone Number" required>
<input type="email" id="email" placeholder="Email">

<select id="state">
<option>Select State</option>
<option>Maharashtra</option>
<option>Delhi</option>
<option>Karnataka</option>
<option>Tamil Nadu</option>
<option>Gujarat</option>
<option>Uttar Pradesh</option>
<option>Bihar</option>
<option>West Bengal</option>
<option>Rajasthan</option>
<option>Punjab</option>
<option>Haryana</option>
<option>Madhya Pradesh</option>
<option>Telangana</option>
<option>Andhra Pradesh</option>
<option>Kerala</option>
<option>Assam</option>
<option>Odisha</option>
<option>Jharkhand</option>
<option>Chhattisgarh</option>
<option>Goa</option>
<option>Uttarakhand</option>
<option>Himachal Pradesh</option>
<option>Jammu & Kashmir</option>
</select>

<textarea id="address" placeholder="Full Address"></textarea>

<button onclick="placeOrder()">Order Now</button>
</div>

</div>

<script>
let payment = "cod";
let price = 499;

function selectPayment(method){
  payment = method;
  document.getElementById("codBox").classList.remove("active");
  document.getElementById("upiBox").classList.remove("active");

  if(method==="upi"){
    document.getElementById("upiBox").classList.add("active");
    price = 449;
  } else {
    document.getElementById("codBox").classList.add("active");
    price = 499;
  }
  document.getElementById("priceText").innerText = "Price: ₹" + price;
}

function placeOrder(){
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;

  if(!name || !phone){
    alert("Please fill required fields");
    return;
  }

  if(payment === "upi"){
    // Replace with your UPI ID
    let upiId = "yourupi@bank";
    let link = `upi://pay?pa=${upiId}&pn=MQ%20Threads&am=${price}&cu=INR`;
    window.location.href = link;
  } else {
    alert("Order placed successfully! Pay on delivery 🚚");
  }
}
</script>

</body>
</html>
