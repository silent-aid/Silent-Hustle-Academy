<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>
<style>
body{font-family:Poppins;background:#f5f5f5;}
.box{
  max-width:450px;
  margin:40px auto;
  background:#fff;
  padding:30px;
  border-radius:20px;
}
input,select,button{
  width:100%;
  padding:12px;
  margin:10px 0;
}
button{
  background:#c9a24d;
  border:none;
  border-radius:30px;
  font-weight:600;
}
</style>
</head>
<body>

<div class="box">
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="addr" placeholder="Address">
<input id="pin" placeholder="Pincode">

<select id="pay">
  <option value="">Select Payment</option>
  <option value="advance">₹100 Advance + COD</option>
  <option value="full">Pay Full (₹50 OFF)</option>
</select>

<button onclick="go()">Pay</button>
</div>

<script>
let oid="MQ"+Math.floor(100000+Math.random()*900000);
localStorage.setItem("orderId",oid);

function go(){
  localStorage.setItem("orderName",name.value);
  localStorage.setItem("orderPhone",phone.value);
  localStorage.setItem("orderAddr",addr.value);
  localStorage.setItem("orderPin",pin.value);
  localStorage.setItem("orderPay",pay.value);

  if(pay.value==="advance")
    location.href="upi://pay?pa=9121783895@fam&pn=MQ%20Threads&am=100&cu=INR";
  if(pay.value==="full")
    location.href="upi://pay?pa=9121783895@fam&pn=MQ%20Threads&am="+(localStorage.getItem("cartTotal")-50)+"&cu=INR";

  setTimeout(()=>location.href="success.html",1500);
}
</script>

</body>
</html>
