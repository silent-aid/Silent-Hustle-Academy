<!DOCTYPE html>
<html>
<head>
<title>Cart | MQ Threads</title>
<style>
body{font-family:Poppins;background:#f5f5f5;}
.box{max-width:700px;margin:40px auto;}
.item{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  display:flex;
  justify-content:space-between;
}
.btn{
  display:inline-block;
  padding:14px 30px;
  background:#c9a24d;
  border-radius:30px;
  text-decoration:none;
  color:#000;
  font-weight:600;
}
</style>
</head>
<body>

<div class="box">
<h2>Your Cart</h2>
<div id="list"></div>
<h3 id="total"></h3>
<a class="btn" href="details.html">Checkout</a>
</div>

<script>
let cart=JSON.parse(localStorage.getItem("cart"))||[];
let sum=0;
cart.forEach(i=>{
  sum+=i.price;
  list.innerHTML+=`<div class="item"><div>${i.name} (${i.size})</div>₹${i.price}</div>`;
});
total.innerText="Total: ₹"+sum;
localStorage.setItem("cartTotal",sum);
</script>

</body>
</html>
