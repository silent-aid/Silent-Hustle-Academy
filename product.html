<!DOCTYPE html>
<html>
<head>
<title>Product | MQ Threads</title>
<style>
body{font-family:Poppins;background:#f5f5f5;margin:0;}
.container{
  max-width:1000px;
  margin:auto;
  padding:40px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}
.card{
  background:#fff;
  padding:30px;
  border-radius:20px;
}
img{width:100%;border-radius:20px;}
.size button{
  padding:10px 18px;
  margin-right:8px;
  border-radius:20px;
  border:1px solid #ccc;
  background:#fff;
}
.size button.active{background:#c9a24d;}
.btn{
  margin-top:20px;
  padding:14px 30px;
  background:#c9a24d;
  border:none;
  border-radius:30px;
  font-weight:600;
}
</style>
</head>
<body>

<div class="container">
  <img id="img">
  <div class="card">
    <h1 id="name"></h1>
    <p id="price"></p>

    <p>Select Size</p>
    <div class="size">
      <button onclick="sel(this)">S</button>
      <button onclick="sel(this)">M</button>
      <button onclick="sel(this)">L</button>
      <button onclick="sel(this)">XL</button>
    </div>

    <button class="btn" onclick="add()">Add to Cart</button>
  </div>
</div>

<script>
const products={
  1:{name:"Premium Black Tee",price:499,show:"₹499 (₹799)",img:"https://drive.google.com/uc?id=1481MDsqUOklkHnUnDfBQ2ockDw8Omz3h",stock:10},
  2:{name:"Oversized Tee",price:549,show:"₹549 (₹899)",img:"https://images.unsplash.com/photo-1520975916090-3105956dac38",stock:5}
};

let stock=JSON.parse(localStorage.getItem("stock"))||{
  "Premium Black Tee":10,
  "Oversized Tee":5
};
localStorage.setItem("stock",JSON.stringify(stock));

let id=new URLSearchParams(location.search).get("id");
let p=products[id];

img.src=p.img;
name.innerText=p.name;
price.innerText=p.show;
localStorage.setItem("currentProduct",p.name);
localStorage.setItem("currentPrice",p.price);

function sel(b){
  document.querySelectorAll(".size button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  localStorage.setItem("size",b.innerText);
}

function add(){
  let size=localStorage.getItem("size");
  if(!size){alert("Select size");return;}
  if(stock[p.name]<=0){alert("Out of stock");return;}

  let cart=JSON.parse(localStorage.getItem("cart"))||[];
  cart.push({name:p.name,size:size,price:p.price});
  localStorage.setItem("cart",JSON.stringify(cart));
  alert("Added to cart");
}
</script>

</body>
</html>
