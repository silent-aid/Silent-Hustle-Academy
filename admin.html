<!DOCTYPE html>
<html>
<head>
  <title>MQ Threads Admin</title>
</head>
<body>
  <h2>Update Order Status</h2>

  <input id="orderId" placeholder="Order ID">
  <select id="status">
    <option value="1">Design Selected</option>
    <option value="2">Waiting for Address</option>
    <option value="3">Address Received</option>
    <option value="4">Order Confirmed</option>
    <option value="5">Printing</option>
    <option value="6">Shipped</option>
    <option value="7">Out for Delivery</option>
    <option value="8">Delivered</option>
  </select>

  <button onclick="updateStatus()">Update</button>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_KEY",
      authDomain: "YOUR_DOMAIN",
      projectId: "YOUR_PROJECT_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function updateStatus() {
      const id = document.getElementById("orderId").value;
      const status = Number(document.getElementById("status").value);

      db.collection("orders").doc(id).update({ status })
        .then(() => alert("Status Updated"))
        .catch(err => alert("Error: " + err));
    }
  </script>
</body>
</html>
