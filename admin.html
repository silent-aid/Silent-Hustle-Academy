<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MQ Threads Admin</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background:#0e0e0e;
      color:#fff;
      font-family:Arial;
      max-width:420px;
      margin:auto;
      padding:40px;
    }
    input, select, button {
      width:100%;
      padding:12px;
      margin-top:12px;
      background:#111;
      color:#fff;
      border:1px solid #333;
    }
    button {
      background:#fff;
      color:#000;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h2>MQ Threads – Admin Panel</h2>

<input id="orderId" placeholder="Order ID (e.g. MQ1021)">
<input id="name" placeholder="Customer Name">
<input id="product" placeholder="Product (T-shirt / Hoodie)">
<input id="size" placeholder="Size (S / M / L / XL)">
<input id="color" placeholder="Color">

<select id="step">
  <option value="0">Design Selected</option>
  <option value="1">Waiting for ₹100 Confirmation</option>
  <option value="2">Printing</option>
  <option value="3">Out for Delivery</option>
  <option value="4">Delivered</option>
</select>

<button onclick="saveOrder()">Save / Update Order</button>

<script>
  // 🔥 PASTE YOUR REAL FIREBASE CONFIG HERE
  firebase.initializeApp({
    apiKey: "PASTE_API_KEY",
    authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
    projectId: "PASTE_PROJECT_ID"
  });

  const db = firebase.firestore();

  function saveOrder() {
    const id = orderId.value.trim();
    if (!id) {
      alert("Order ID required");
      return;
    }

    db.collection("orders").doc(id).set({
      name: name.value,
      product: product.value,
      size: size.value,
      color: color.value,
      step: Number(step.value)
    }).then(() => {
      alert("✅ Order saved");
    }).catch(err => {
      alert("❌ Error saving");
      console.error(err);
    });
  }
</script>

</body>
</html>
