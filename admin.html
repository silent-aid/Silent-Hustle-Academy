<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
<style>
body{font-family:Poppins;background:#f5f5f5;padding:40px;}
table{width:100%;background:#fff;border-radius:15px;}
th,td{padding:12px;border-bottom:1px solid #ddd;}
</style>
</head>
<body>

<h2>Last Order</h2>
<table>
<tr><th>Product</th><th>Size</th><th>Price</th></tr>
<tbody id="o"></tbody>
</table>

<h2>Stock</h2>
<div id="s"></div>

<script>
(JSON.parse(localStorage.getItem("lastOrder"))||[]).forEach(i=>{
  o.innerHTML+=`<tr><td>${i.name}</td><td>${i.size}</td><td>₹${i.price}</td></tr>`;
});

let st=JSON.parse(localStorage.getItem("stock"));
for(let k in st) s.innerHTML+=`<p>${k}: ${st[k]}</p>`;
</script>

</body>
</html>
