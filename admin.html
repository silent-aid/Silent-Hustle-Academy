<!DOCTYPE html>
<html>
<head>
  <title>MQ Threads Admin</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background:#0e0e0e;
      color:white;
      font-family:Arial;
      padding:40px;
      max-width:400px;
      margin:auto;
    }
    input, select, button {
      width:100%;
      padding:10px;
      margin-top:10px;
      background:#111;
      color:white;
      border:1px solid #333;
    }
    button {
      background:white;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h2>MQ Threads – Admin Panel</h2>

<input id="oid" placeholder="Order ID (MQ1021)">
<input id="cname" placeholder="Customer Name">
<input id="product" placeholder="Product (T-shirt / Hoodie)">
<input id="size" placeholder="Size (S / M / L / XL)">
<input id="color" placeholder="Color">

<select id="step">
  <option value="0">Design Selected</option>
  <option value="1">Waiting for ₹100 Confirmation</option>
  <option value="2">Printing</option>
  <option value="3">Out for Delivery</option>
  <option value="4">Delivered</option>
</select>

<button onclick="save()">Save / Update Order</button>

<script>
firebase.initializeApp({
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
});

const db = firebase.firestore();

function save(){
  db.collection("orders").doc(oid.value).set({
    name: cname.value,
    product: product.value,
    size: size.value,
    color: color.value,
    step: Number(step.value)
  }).then(()=>{
    alert("✅ Order saved successfully");
  });
}
</script>

</body>
</html>
