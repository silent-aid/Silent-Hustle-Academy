<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MQ Threads | Premium Hoodie</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#0b0b0b;color:white}

header{
background:black;
padding:15px;
text-align:center;
font-size:20px;
letter-spacing:2px;
border-bottom:2px solid #ff2a2a;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.slider img{
width:100%;
border-radius:15px;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

.thumbs{
display:flex;
gap:10px;
margin-top:10px;
}
.thumbs img{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px;
cursor:pointer;
opacity:.6;
}
.thumbs img:hover{opacity:1}

.price{
font-size:28px;
color:#00ff9d;
}
.old{
text-decoration:line-through;
color:gray;
font-size:18px;
}

.select, .qty{
margin:15px 0;
}

select,input{
padding:10px;
width:100%;
border-radius:8px;
border:none;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#ff2a2a;
color:white;
border:none;
font-size:18px;
border-radius:10px;
cursor:pointer;
margin-top:15px;
transition:.3s;
}
button:hover{transform:scale(1.03);background:#ff4444}

.features{
margin-top:20px;
line-height:1.8;
color:#ccc;
}

.badge{
background:gold;
color:black;
display:inline-block;
padding:5px 10px;
border-radius:20px;
font-size:12px;
margin-bottom:10px;
}

@media(max-width:800px){
.container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>MQ THREADS – PREMIUM HOODIE</header>

<div class="container">

<!-- LEFT -->
<div>
<div class="slider">
<img id="mainImg" src="images/hoodie1.jpg">
</div>

<div class="thumbs">
<img src="images/hoodie1.jpg" onclick="changeImg(this)">
<img src="images/hoodie2.jpg" onclick="changeImg(this)">
<img src="images/hoodie3.jpg" onclick="changeImg(this)">
</div>
</div>

<!-- RIGHT -->
<div>
<div class="badge">🔥 Trending</div>
<h2>Premium Printed Hoodie</h2>

<p class="price">₹499 <span class="old">₹999</span></p>
<p>50% OFF – Limited Stock</p>

<div class="select">
<label>Size</label>
<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>
</div>

<div class="qty">
<label>Quantity</label>
<input type="number" id="qty" value="1" min="1">
</div>

<button onclick="buyNow()">BUY NOW</button>

<div class="features">
✔ Premium Cotton Blend<br>
✔ Unisex Fit<br>
✔ Winter Wear<br>
✔ COD Available<br>
✔ 7 Days Replacement
</div>
</div>
</div>

<script>
function changeImg(el){
document.getElementById("mainImg").src = el.src;
}

function buyNow(){
let size = document.getElementById("size").value;
let qty = document.getElementById("qty").value;

localStorage.setItem("product","Premium Hoodie");
localStorage.setItem("price","499");
localStorage.setItem("size",size);
localStorage.setItem("qty",qty);

window.location.href="buy.html";
}
</script>

</body>
</html>
