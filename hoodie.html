<!DOCTYPE html>
<html>
<head>
<title>Premium Hoodie | MQ Threads</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#000;
color:white;
}
nav{
padding:15px 20px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
}
nav a{color:white;text-decoration:none;margin-left:15px}
.container{
max-width:900px;
margin:auto;
padding:20px;
display:flex;
flex-wrap:wrap;
gap:30px;
}
.img-box img{
width:100%;
border-radius:12px;
}
.details{
flex:1;
min-width:250px;
}
.price{color:#00ff9d;font-size:24px;font-weight:bold}
select,input{
width:100%;
padding:10px;
margin-top:10px;
background:#111;
color:white;
border:1px solid #333;
border-radius:6px;
}
button{
margin-top:15px;
padding:12px;
width:100%;
background:#00ff9d;
border:none;
font-size:18px;
font-weight:bold;
border-radius:8px;
}
</style>
</head>

<body>

<nav>
<b>MQ Threads</b>
<div>
<a href="index.html">Home</a>
<a href="checkout.html">Checkout</a>
</div>
</nav>

<div class="container">

<div class="img-box">
<img src="images/hoodie.jpg">
</div>

<div class="details">
<h2>Premium Printed Hoodie</h2>
<p class="price">₹499</p>

<label>Size</label>
<select id="size">
<option>S</option>
<option selected>M</option>
<option>L</option>
<option>XL</option>
</select>

<label>Quantity</label>
<input type="number" id="qty" value="1" min="1">

<button onclick="buyNow()">Buy Now</button>
</div>

</div>

<script>
function buyNow(){
var size = document.getElementById("size").value;
var qty = document.getElementById("qty").value;

localStorage.setItem("product","Premium Printed Hoodie");
localStorage.setItem("size",size);
localStorage.setItem("qty",qty);
localStorage.setItem("price","499");

window.location.href = "checkout.html";
}
</script>

</body>
</html>
