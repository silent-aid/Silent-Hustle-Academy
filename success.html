<!DOCTYPE html>
<html>
<head>
<title>Order Confirmed</title>
<style>
body{text-align:center;font-family:Poppins;background:#f5f5f5;padding:40px;}
.card{background:#fff;padding:30px;border-radius:20px;max-width:400px;margin:auto;}
a{display:inline-block;margin-top:20px;padding:14px 30px;background:#25D366;color:#fff;border-radius:30px;text-decoration:none;}
</style>
</head>
<body>

<div class="card">
<h2>Order Confirmed 🎉</h2>
<a id="wa">Send Order on WhatsApp</a>
</div>

<script>
let cart=JSON.parse(localStorage.getItem("cart"))||[];
let stock=JSON.parse(localStorage.getItem("stock"));

cart.forEach(p=>stock[p.name]--);
localStorage.setItem("stock",JSON.stringify(stock));
localStorage.setItem("lastOrder",JSON.stringify(cart));
localStorage.removeItem("cart");

let msg="MQ THREADS ORDER\nID:"+localStorage.getItem("orderId");
wa.href="https://wa.me/919121783895?text="+encodeURIComponent(msg);
</script>

</body>
</html>
