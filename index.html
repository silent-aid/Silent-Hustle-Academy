<!DOCTYPE html>
<html>
<head>
<title>MQ Threads</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#111;
  --muted:#666;
  --accent:#c9a24d;
}
body{margin:0;font-family:Poppins;background:var(--bg);color:var(--text);}
nav{padding:20px;text-align:center;background:#fff;}
nav a{margin:0 15px;color:#111;text-decoration:none;font-weight:500;}
.hero{text-align:center;padding:50px;}
.grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  padding:20px;
}
.card{
  background:var(--card);
  border-radius:20px;
  padding:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.card img{width:100%;border-radius:15px;}
.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px 20px;
  background:var(--accent);
  color:#000;
  border-radius:25px;
  text-decoration:none;
  font-weight:600;
}
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="cart.html">Cart</a>
  <a href="admin.html">Admin</a>
</nav>

<div class="hero">
  <h1>MQ THREADS</h1>
  <p>Luxury • Minimal • Streetwear</p>
</div>

<div class="grid">
  <div class="card">
    <img src="https://drive.google.com/uc?id=1481MDsqUOklkHnUnDfBQ2ockDw8Omz3h">
    <h3>Premium Black Tee</h3>
    <p>₹499 <del>₹799</del></p>
    <a class="btn" href="product.html?id=1">View</a>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
    <h3>Oversized Tee</h3>
    <p>₹549 <del>₹899</del></p>
    <a class="btn" href="product.html?id=2">View</a>
  </div>
</div>

</body>
</html>
