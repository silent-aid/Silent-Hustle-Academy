<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MQ Threads | Premium Streetwear</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#000;
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#000;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:1000;
}

nav h2{
margin:0;
color:#00ff9d;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:500;
}

.hero{
min-height:70vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url("images/hero.jpg") center/cover;
padding:40px;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
opacity:0.8;
font-size:18px;
}

.hero button{
margin-top:20px;
padding:12px 28px;
font-size:18px;
border:none;
border-radius:10px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.hero button:hover{
transform:scale(1.05);
}

.featured{
padding:60px 20px;
text-align:center;
}

.card{
max-width:320px;
margin:30px auto;
background:#111;
border-radius:18px;
padding:15px;
box-shadow:0 0 30px rgba(0,255,150,0.08);
transition:0.4s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
border-radius:14px;
}

.price{
color:#00ff9d;
font-size:22px;
font-weight:bold;
}

.card button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
background:#00ff9d;
font-weight:bold;
cursor:pointer;
}

.footer{
text-align:center;
padding:25px;
border-top:1px solid #222;
opacity:0.6;
font-size:14px;
}
</style>
</head>

<body>

<nav>
<h2>MQ Threads</h2>
<div>
<a href="index.html">Home</a>
<a href="hoodie.html">Hoodie</a>
<a href="checkout.html">Checkout</a>
</div>
</nav>

<section class="hero">
<div>
<h1>Premium Streetwear</h1>
<p>Minimal. Bold. Made for the culture.</p>
<button onclick="window.location.href='hoodie.html'">
Shop Hoodie
</button>
</div>
</section>

<section class="featured">
<h2>Featured Product</h2>
<p style="opacity:0.7">Our best selling hoodie</p>

<div class="card">
<img src="images/hoodie.jpg" alt="Premium Hoodie">
<h3>Premium Printed Hoodie</h3>
<p class="price">₹499</p>
<button onclick="window.location.href='hoodie.html'">
View Product
</button>
</div>
</section>

<div class="footer">
© 2026 MQ Threads. All rights reserved.
</div>

</body>
</html>
