<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout | MQ Threads</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin:0;
  font-family: 'Poppins', sans-serif;
  background:#0b0b0b;
  color:#fff;
}

.container {
  max-width:480px;
  margin:auto;
  padding:20px;
}

.card {
  background:#141414;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 0 30px rgba(0,0,0,0.7);
}

h2 {margin-bottom:10px;}

.payment-option {
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px;
  border:2px solid #333;
  border-radius:14px;
  margin:12px 0;
  cursor:pointer;
  transition:0.3s;
}

.payment-option.active {
  border-color:#00ff99;
  background:#0f1f1a;
  box-shadow:0 0 15px rgba(0,255,153,0.3);
}

.payment-option i {
  font-size:28px;
}

.discount {
  margin-left:auto;
  color:#00ff99;
  font-size:13px;
  font-weight:600;
}

input, select, textarea {
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  outline:none;
  background:#1f1f1f;
  color:#fff;
  font-size:14px;
}

button {
  width:100%;
  padding:18px;
  background:linear-gradient(135deg,#00ff99,#00ccff);
  border:none;
  border-radius:16px;
  color:#000;
  font-size:18px;
  font-weight:700;
  margin-top:18px;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,255,200,0.4);
  transition:0.3s;
}

button:hover {
  transform:scale(1.04);
}
</style>
</head>

<body>
<div class="container">

<!-- ORDER SUMMARY -->
<div class="card">
<h2>Order Summary</h2>
<p><b>Product:</b> Premium Hoodie – MQ Threads</p>
<p id="priceText"><b>Total:</b> ₹499</p>
</div>

<!-- PAYMENT -->
<div class="card">
<h2>Payment Method</h2>

<div class="payment-option active" onclick="selectPayment('cod')" id="codBox">
<i class="fa-solid fa-truck"></i>
Cash on Delivery
</div>

<div class="payment-option" onclick="selectPayment('upi')" id="upiBox">
<i class="fa-solid fa-mobile-screen"></i>
UPI / Online Payment
<span class="discount">₹50 OFF</span>
</div>
</div>

<!-- SHIPPING -->
<div class="card">
<h2>Shipping Details</h2>

<input type="text" id="name" placeholder="Full Name *">
<input type="tel" id="phone" placeholder="Phone Number *">
<input type="email" id="email" placeholder="Email">

<select id="state">
<option>Select State *</option>
<option>Andhra Pradesh</option>
<option>Arunachal Pradesh</option>
<option>Assam</option>
<option>Bihar</option>
<option>Chhattisgarh</option>
<option>Delhi</option>
<option>Goa</option>
<option>Gujarat</option>
<option>Haryana</option>
<option>Himachal Pradesh</option>
<option>Jharkhand</option>
<option>Karnataka</option>
<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Maharashtra</option>
<option>Manipur</option>
<option>Meghalaya</option>
<option>Mizoram</option>
<option>Nagaland</option>
<option>Odisha</option>
<option>Punjab</option>
<option>Rajasthan</option>
<option>Sikkim</option>
<option>Tamil Nadu</option>
<option>Telangana</option>
<option>Tripura</option>
<option>Uttar Pradesh</option>
<option>Uttarakhand</option>
<option>West Bengal</option>
</select>

<textarea id="address" placeholder="Full Address *"></textarea>

<button onclick="placeOrder()">Order Now</button>
</div>

</div>

<script>
let payment = "cod";
let price = 499;

// YOUR REAL FAMPAY UPI
let upiId = "9121783895@fam";

function selectPayment(method){
  payment = method;
  document.getElementById("codBox").classList.remove("active");
  document.getElementById("upiBox").classList.remove("active");

  if(method==="upi"){
    document.getElementById("upiBox").classList.add("active");
    price = 449;
  } else {
    document.getElementById("codBox").classList.add("active");
    price = 499;
  }

  document.getElementById("priceText").innerHTML = "<b>Total:</b> ₹" + price;
}

function placeOrder(){
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let state = document.getElementById("state").value;
  let address = document.getElementById("address").value;

  if(!name || !phone || state==="Select State *" || !address){
    alert("Please fill all required fields");
    return;
  }

  if(payment === "upi"){
    let link = `upi://pay?pa=${upiId}&pn=MQ%20Threads&am=${price}&cu=INR`;
    window.location.href = link;

    setTimeout(()=>{
      window.location.href = "thankyou.html";
    },3000);

  } else {
    window.location.href = "thankyou.html";
  }
}
</script>

</body>
</html>
