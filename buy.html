<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Secure Checkout | MQ Threads</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top,#000,#050505);
  color: white;
  margin: 0;
  padding: 20px;
}

.marquee {
  background: linear-gradient(90deg,#ff0000,#ff0055);
  padding: 10px;
  text-align: center;
  font-weight: bold;
  animation: slide 15s linear infinite;
  white-space: nowrap;
  overflow: hidden;
}

@keyframes slide {
  0% {transform: translateX(100%)}
  100% {transform: translateX(-100%)}
}

.container {
  max-width: 520px;
  margin: auto;
}

.card {
  background: #111;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 0 30px rgba(0,0,0,0.7);
}

h2 { margin-top:0; }

label {
  display:block;
  margin-top:14px;
  font-weight:600;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  background: #1f1f1f;
  color: white;
  border: 1px solid #333;
  border-radius: 10px;
  font-size:14px;
}

button {
  margin-top: 22px;
  width:100%;
  padding: 16px;
  background: linear-gradient(135deg,#00ff99,#00ccff);
  border: none;
  font-size: 18px;
  font-weight: 700;
  border-radius: 14px;
  cursor: pointer;
  color:#000;
  box-shadow:0 5px 20px rgba(0,255,200,0.4);
  transition:0.3s;
}

button:hover { transform: scale(1.04); }

.summary-box {
  background:#000;
  border:1px solid #222;
  padding:14px;
  border-radius:12px;
  line-height:1.8;
}

.offer-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.offer {
  background:#0b0b0b;
  border:1px solid #222;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}

.payment-option {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border:2px solid #333;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
  transition:0.3s;
}

.payment-option.active {
  border-color:#00ff99;
  background:#0f1f1a;
}

.payment-option i { font-size:24px; }

.discount {
  margin-left:auto;
  color:#00ff99;
  font-size:13px;
}

#otherCityField { display:none; }
</style>
</head>

<body>

<div class="marquee">
🔥 MQ THREADS | PREMIUM STREETWEAR | FREE DELIVERY ALL OVER INDIA 🇮🇳
</div>

<div class="container">

<!-- ORDER SUMMARY -->
<div class="card">
<h2>Order Summary</h2>
<div class="summary-box" id="summaryBox">
Select product to view details.
</div>
</div>

<!-- TRUST -->
<div class="card">
<h2>Why MQ Threads?</h2>
<div class="offer-grid">
<div class="offer">⭐ 4.8/5 Customer Rating</div>
<div class="offer">🚚 Free Delivery</div>
<div class="offer">💵 COD Available</div>
<div class="offer">🔐 Secure Payments</div>
</div>
</div>

<!-- PAYMENT -->
<div class="card">
<h2>Payment Method</h2>

<div class="payment-option active" onclick="selectPayment('cod')" id="codBox">
<i class="fa-solid fa-truck"></i>
Cash on Delivery
</div>

<div class="payment-option" onclick="selectPayment('upi')" id="upiBox">
<i class="fa-solid fa-mobile-screen"></i>
UPI / Online Payment
<span class="discount">₹50 OFF</span>
</div>
</div>

<!-- FORM -->
<div class="card">
<h2>Shipping Details</h2>

<form id="orderForm">
<label>Full Name
<input type="text" name="name" required>
</label>

<label>Email
<input type="email" name="email" required>
</label>

<label>Phone Number
<input type="tel" name="phone" required>
</label>

<label>WhatsApp Number
<input type="tel" name="whatsapp" required>
</label>

<label>Choose Product
<select name="product" id="productSelect" required>
<option value="">-- Select Product --</option>
<option value="Premium Hoodie">Premium Hoodie</option>
<option value="Oversized T-Shirt">Oversized T-Shirt</option>
<option value="Streetwear Combo">Streetwear Combo</option>
</select>
</label>

<label>Price
<input type="text" id="priceDisplay" name="price" readonly>
</label>

<label>City
<select name="city" id="citySelect" required>
<option value="">-- Select Your City --</option>
<option>Mumbai</option><option>Delhi</option><option>Bangalore</option>
<option>Hyderabad</option><option>Chennai</option><option>Pune</option>
<option>Kolkata</option><option>Ahmedabad</option><option>Jaipur</option>
<option value="Other">Other</option>
</select>
</label>

<div id="otherCityField">
<label>Enter Your City
<input type="text" id="otherCityInput">
</label>
</div>

<label>Full Address
<textarea name="address" required></textarea>
</label>

<input type="hidden" name="payment" id="paymentField" value="COD">

<button type="submit">Place Order</button>
</form>
</div>

</div>

<script>
let payment = "cod";

const productPrices = {
  "Premium Hoodie": 499,
  "Oversized T-Shirt": 399,
  "Streetwear Combo": 799
};

const productSelect = document.getElementById('productSelect');
const priceDisplay = document.getElementById('priceDisplay');
const summaryBox = document.getElementById('summaryBox');

productSelect.addEventListener('change', () => {
  let p = productSelect.value;
  let price = productPrices[p] || "";
  priceDisplay.value = price;
  summaryBox.innerHTML = `
  <b>Product:</b> ${p}<br>
  <b>Price:</b> ₹${price}<br>
  <b>Payment:</b> ${payment.toUpperCase()}
  `;
});

function selectPayment(method){
  payment = method;
  document.getElementById("codBox").classList.remove("active");
  document.getElementById("upiBox").classList.remove("active");

  if(method==="upi"){
    document.getElementById("upiBox").classList.add("active");
    document.getElementById("paymentField").value="UPI";
  } else {
    document.getElementById("codBox").classList.add("active");
    document.getElementById("paymentField").value="COD";
  }
}

// City logic
const citySelect = document.getElementById('citySelect');
const otherCityField = document.getElementById('otherCityField');
const otherCityInput = document.getElementById('otherCityInput');

citySelect.addEventListener('change', () => {
  if (citySelect.value === 'Other') {
    otherCityField.style.display = 'block';
    otherCityInput.required = true;
  } else {
    otherCityField.style.display = 'none';
    otherCityInput.required = false;
  }
});

// EMAIL SYSTEM (UNCHANGED)
document.getElementById('orderForm').addEventListener('submit', function(e){
  e.preventDefault();
  const formData = new FormData(this);

  if (citySelect.value === 'Other') {
    formData.set('city', otherCityInput.value.trim());
  }

  const url = "https://script.google.com/macros/s/AKfycbxisICLhzPNqqXPnFdBcAZkiz2iuLvmoIy-kvbzXf5e4JtVyr7jKpuUldWQT9iWlex4/exec";

  fetch(url,{method:"POST",body:formData})
  .then(()=> window.location.href="thankyou.html")
  .catch(()=> alert("Order failed. Try again."));
});
</script>

</body>
</html>
