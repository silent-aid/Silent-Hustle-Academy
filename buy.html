<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Checkout | MQ Threads</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Poppins',sans-serif;
background:#0b0b0b;
color:#fff;
}

.banner{
background:linear-gradient(90deg,#00ff99,#00ccff);
color:#000;
padding:10px;
text-align:center;
font-weight:700;
}

.container{
max-width:480px;
margin:auto;
padding:15px;
}

.card{
background:#141414;
border-radius:16px;
padding:18px;
margin-bottom:14px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

h2{margin:0 0 10px}

.summary-row{
display:flex;
justify-content:space-between;
margin:6px 0;
}

.highlight{
background:#102a22;
border:1px solid #00ff99;
padding:10px;
border-radius:10px;
color:#00ff99;
text-align:center;
margin-bottom:10px;
font-size:14px;
}

.payment-option{
display:flex;
align-items:center;
gap:12px;
padding:14px;
border:2px solid #333;
border-radius:12px;
margin:10px 0;
cursor:pointer;
transition:0.3s;
}

.payment-option.active{
border-color:#00ff99;
background:#0f1f1a;
}

.payment-option i{
font-size:24px;
}

.apps{
display:flex;
gap:10px;
margin-top:6px;
font-size:22px;
opacity:0.8;
}

input,select,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;
background:#1f1f1f;
color:#fff;
}

button{
width:100%;
padding:16px;
background:linear-gradient(135deg,#00ff99,#00ccff);
border:none;
border-radius:14px;
color:#000;
font-size:18px;
font-weight:600;
margin-top:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="banner">
🔥 Pay via UPI & Get Flat ₹50 OFF – Limited Offer
</div>

<div class="container">

<!-- SUMMARY -->
<div class="card">
<h2>Order Summary</h2>
<div class="summary-row"><span>Product</span><b>Premium Hoodie</b></div>
<div class="summary-row"><span>Quantity</span><b id="qtyText">1</b></div>
<div class="summary-row"><span>Price</span><b id="priceText">₹499</b></div>
<hr>
<div class="summary-row"><span>Total</span><b id="totalText">₹499</b></div>
</div>

<!-- PAYMENT -->
<div class="card">
<h2>Payment Method</h2>

<div class="highlight" id="discountBox" style="display:none">
🎉 ₹50 OFF applied for UPI payment
</div>

<div class="payment-option active" id="codBox" onclick="selectPayment('cod')">
<i class="fa-solid fa-truck"></i> Cash on Delivery
</div>

<div class="payment-option" id="upiBox" onclick="selectPayment('upi')">
<i class="fa-solid fa-bolt"></i> UPI / Online Payment
<div class="apps">
<i class="fa-brands fa-google-pay"></i>
<i class="fa-solid fa-mobile"></i>
<i class="fa-solid fa-wallet"></i>
</div>
</div>
</div>

<!-- FORM -->
<div class="card">
<h2>Shipping Details</h2>
<input id="name" placeholder="Full Name *">
<input id="phone" placeholder="Phone Number *">
<input id="email" placeholder="Email">

<select id="state">
<option value="">Select State *</option>
<option>Andhra Pradesh</option>
<option>Telangana</option>
<option>Maharashtra</option>
<option>Delhi</option>
<option>Uttar Pradesh</option>
<option>West Bengal</option>
<option>Tamil Nadu</option>
<option>Karnataka</option>
<option>Gujarat</option>
<option>Rajasthan</option>
<option>Punjab</option>
<option>Bihar</option>
<option>Kerala</option>
<option>Madhya Pradesh</option>
<option>Odisha</option>
<option>Assam</option>
<option>Chhattisgarh</option>
<option>Goa</option>
<option>Haryana</option>
<option>Jharkhand</option>
<option>Jammu & Kashmir</option>
<option>Uttarakhand</option>
</select>

<!-- CITY -->
<select id="city">
<option value="">Select City *</option>
</select>

<textarea id="address" placeholder="Full Address *"></textarea>

<button onclick="placeOrder()">Place Order</button>
</div>

</div>

<script>
let payment="cod";
let basePrice=499;
let finalPrice=499;
let qty=1;

const cities={
"Andhra Pradesh":["Hyderabad","Vijayawada","Visakhapatnam","Guntur"],
"Telangana":["Hyderabad","Warangal","Karimnagar","Nizamabad"],
"Maharashtra":["Mumbai","Pune","Nagpur","Nashik"],
"Delhi":["New Delhi","Rohini","Dwarka","Saket"],
"Uttar Pradesh":["Noida","Lucknow","Kanpur","Agra"],
"West Bengal":["Kolkata","Howrah","Asansol"],
"Tamil Nadu":["Chennai","Coimbatore","Madurai"],
"Karnataka":["Bangalore","Mysore","Hubli"],
"Gujarat":["Ahmedabad","Surat","Vadodara"],
"Rajasthan":["Jaipur","Jodhpur","Udaipur"],
"Punjab":["Ludhiana","Amritsar"],
"Bihar":["Patna","Gaya"],
"Kerala":["Kochi","Trivandrum"],
"Madhya Pradesh":["Indore","Bhopal"],
"Odisha":["Bhubaneswar","Cuttack"],
"Assam":["Guwahati","Silchar"],
"Chhattisgarh":["Raipur","Bilaspur"],
"Goa":["Panaji","Margao"],
"Haryana":["Gurgaon","Faridabad"],
"Jharkhand":["Ranchi","Jamshedpur"],
"Jammu & Kashmir":["Srinagar","Jammu"],
"Uttarakhand":["Dehradun","Haridwar"]
};

document.getElementById("state").addEventListener("change",function(){
let citySel=document.getElementById("city");
citySel.innerHTML="<option value=''>Select City *</option>";
let s=this.value;
if(cities[s]){
cities[s].forEach(c=>{
let o=document.createElement("option");
o.value=c;o.textContent=c;
citySel.appendChild(o);
});
}
});

function updateUI(){
document.getElementById("qtyText").innerText=qty;
document.getElementById("priceText").innerText="₹"+finalPrice;
document.getElementById("totalText").innerText="₹"+finalPrice;
}

function selectPayment(type){
payment=type;
document.getElementById("codBox").classList.remove("active");
document.getElementById("upiBox").classList.remove("active");

if(type==="upi"){
finalPrice=basePrice-50;
document.getElementById("upiBox").classList.add("active");
document.getElementById("discountBox").style.display="block";
}else{
finalPrice=basePrice;
document.getElementById("codBox").classList.add("active");
document.getElementById("discountBox").style.display="none";
}
updateUI();
}

function placeOrder(){
let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();
let state=document.getElementById("state").value;
let city=document.getElementById("city").value;
let address=document.getElementById("address").value.trim();

if(!name||!phone||!state||!city||!address){
alert("Please fill all required fields");
return;
}

let data=new FormData();
data.append("name",name);
data.append("phone",phone);
data.append("state",state);
data.append("city",city);
data.append("address",address);
data.append("payment",payment);

fetch("https://script.google.com/macros/s/AKfycbxisICLhzPNqqXPnFdBcAZkiz2iuLvmoIy-kvbzXf5e4JtVyr7jKpuUldWQT9iWlex4/exec",
{method:"POST",body:data});

if(payment==="upi"){
let upi="9121783895@fam";
let link=`upi://pay?pa=${upi}&pn=MQ%20Threads&am=${finalPrice}&cu=INR`;
window.location.href=link;
}else{
window.location.href="thankyou.html";
}
}
</script>

</body>
</html>
