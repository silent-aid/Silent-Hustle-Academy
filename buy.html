<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | MQ Threads</title>
<style>
body{margin:0;font-family:system-ui;background:#0b0b0b;color:#fff}
.wrap{max-width:420px;margin:auto;padding:12px}
.box{background:#141414;border-radius:12px;padding:14px;margin-bottom:10px}
h3{margin:6px 0}
.opt{padding:12px;border:2px solid #333;border-radius:10px;margin:8px 0}
.opt.active{border:#00ff99 2px solid;background:#0f1f1a}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none;background:#1f1f1f;color:#fff}
button{width:100%;padding:14px;background:#00ff99;color:#000;border:none;border-radius:10px;font-weight:600}
.green{color:#00ff99}
</style>
</head>

<body>
<div class="wrap">

<div class="box">
<h3>Order</h3>
<p>MQ Threads Hoodie</p>
<p id="price">Price: ₹499</p>
<p id="disc" class="green" style="display:none">UPI Discount -₹50</p>
</div>

<div class="box">
<h3>Payment</h3>
<div class="opt active" id="cod" onclick="pay('cod')">Cash on Delivery</div>
<div class="opt" id="upi" onclick="pay('upi')">UPI (GPay / PhonePe / Paytm)</div>
</div>

<div class="box">
<h3>Details</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<select id="state">
<option value="">State</option>
<option>Maharashtra</option><option>Delhi</option><option>Karnataka</option>
<option>Tamil Nadu</option><option>Telangana</option><option>Gujarat</option>
<option>Uttar Pradesh</option><option>Bihar</option><option>West Bengal</option>
<option>Rajasthan</option><option>Punjab</option><option>Kerala</option>
<option>Madhya Pradesh</option><option>Odisha</option><option>Assam</option>
<option>Jharkhand</option><option>Chhattisgarh</option>
<option>Jammu & Kashmir</option><option>Ladakh</option>
<option>Chandigarh</option><option>Puducherry</option>
</select>

<select id="city">
<option value="">City</option>
<option>Mumbai</option><option>Delhi</option><option>Bangalore</option>
<option>Hyderabad</option><option>Chennai</option><option>Pune</option>
<option>Ahmedabad</option><option>Jaipur</option><option>Indore</option>
<option>Bhopal</option><option>Patna</option><option>Kolkata</option>
<option>Lucknow</option><option>Noida</option><option>Gurgaon</option>
<option>Faridabad</option><option>Surat</option><option>Rajkot</option>
</select>

<input type="date" id="date">

<textarea id="address" placeholder="Full Address"></textarea>

<button onclick="order()">Order Now</button>
</div>

</div>

<script>
let mode="cod",price=499;

function pay(t){
mode=t;
cod.classList.remove("active");
upi.classList.remove("active");
if(t=="upi"){
upi.classList.add("active");
price=449;
disc.style.display="block";
}else{
cod.classList.add("active");
price=499;
disc.style.display="none";
}
priceText="Price: ₹"+price;
price.innerText=priceText;
}

function order(){
if(!name.value||!phone.value||!state.value||!city.value){
alert("Fill all fields");return;
}

let data=new FormData();
data.append("name",name.value);
data.append("phone",phone.value);
data.append("email",email.value);
data.append("state",state.value);
data.append("city",city.value);
data.append("date",date.value);
data.append("address",address.value);
data.append("payment",mode);
data.append("amount",price);

// YOUR GOOGLE SCRIPT URL (EMAIL)
fetch("YOUR_GOOGLE_SCRIPT_URL",{method:"POST",body:data});

if(mode=="upi"){
let upiId="9121783895@fam";
window.location.href=`upi://pay?pa=${upiId}&pn=MQ%20Threads&am=${price}&cu=INR`;
}

setTimeout(()=>{window.location="thankyou.html"},2500);
}
</script>
</body>
</html>
