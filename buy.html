<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Checkout | MQ Threads</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Poppins,system-ui;
background:radial-gradient(circle at top,#000,#050505);
color:white;
margin:0;
padding:20px;
}

.marquee{
background:linear-gradient(90deg,#ff0000,#ff0066);
padding:10px;
text-align:center;
font-weight:600;
white-space:nowrap;
overflow:hidden;
}

.container{
max-width:720px;
margin:30px auto;
}

.card{
background:linear-gradient(180deg,#141414,#0d0d0d);
padding:24px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.7);
margin-bottom:20px;
}

h2{text-align:center;margin:0}
.sub{text-align:center;opacity:.7;margin-bottom:15px}

.summary-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:10px;
}
.summary-box{
background:#1c1c1c;
padding:14px;
border-radius:14px;
}

.price-box{
background:#000;
border:1px solid #222;
padding:16px;
border-radius:16px;
margin-top:10px;
line-height:1.8;
}

label{display:block;margin-top:14px;font-weight:600}
input,textarea{
width:100%;
padding:12px;
margin-top:6px;
background:#1a1a1a;
color:white;
border:1px solid #333;
border-radius:10px;
}

.payment-box{
display:flex;
gap:12px;
margin-top:12px;
}
.payment-box div{
flex:1;
background:#1a1a1a;
border:1px solid #333;
padding:14px;
border-radius:14px;
cursor:pointer;
text-align:center;
font-weight:600;
}
.active-pay{
border-color:#00ff9d;
background:#003326;
}

.upi-info{
margin-top:10px;
padding:12px;
background:#000;
border-radius:12px;
border:1px dashed #00ff9d;
display:none;
}

button{
margin-top:25px;
width:100%;
padding:16px;
background:linear-gradient(45deg,#00ff9d,#00ffaa);
border:none;
font-size:18px;
font-weight:700;
border-radius:16px;
cursor:pointer;
}
button:active{transform:scale(.98)}
</style>
</head>

<body>

<div class="marquee">
🔥 Free Delivery | COD & UPI Available | Premium Streetwear
</div>

<div class="container">
<div class="card">
<h2>Secure Checkout</h2>
<p class="sub">Complete your order in 30 seconds</p>

<div class="summary-grid">
<div class="summary-box">
<b>Product</b><br>
<span id="pName"></span>
</div>
<div class="summary-box">
<b>Color</b><br>
<span id="pColor"></span>
</div>
<div class="summary-box">
<b>Quantity</b><br>
<span id="pQty"></span>
</div>
<div class="summary-box">
<b>Size</b><br>
Free Size
</div>
</div>

<div class="price-box">
MRP: ₹999<br>
Discount: -₹500<br>
<b style="font-size:20px">Total: ₹<span id="pTotal"></span></b>
</div>
</div>

<div class="card">
<form id="orderForm">
<label>Full Name
<input type="text" name="name" required>
</label>

<label>Phone
<input type="tel" name="phone" required>
</label>

<label>WhatsApp
<input type="tel" name="whatsapp" required>
</label>

<label>City
<input type="text" name="city" required>
</label>

<label>Full Address
<textarea name="address" required></textarea>
</label>

<input type="hidden" name="product" id="productField">
<input type="hidden" name="qty" id="qtyField">
<input type="hidden" name="price" id="priceField">
<input type="hidden" name="color" id="colorField">
<input type="hidden" name="payment" id="paymentField">

<label>Select Payment</label>
<div class="payment-box">
<div id="codBox">Cash on Delivery</div>
<div id="upiBox">UPI</div>
</div>

<div class="upi-info" id="upiInfo">
Pay to: <b>9121783895@fam</b><br>
Then click confirm.
</div>

<button type="submit">Confirm Order</button>
</form>
</div>
</div>

<script>
// From product page
let product = localStorage.getItem("product") || "Premium Hoodie";
let qty = parseInt(localStorage.getItem("qty") || 1);
let price = parseInt(localStorage.getItem("price") || 499);
let color = localStorage.getItem("color") || "Black";

let total = price * qty;

// UI
pName.innerText = product;
pQty.innerText = qty;
pColor.innerText = color;
pTotal.innerText = total;

// Hidden fields
productField.value = product;
qtyField.value = qty;
priceField.value = total;
colorField.value = color;

// Payment
let paymentMethod="";
codBox.onclick=()=>{
paymentMethod="COD";
codBox.classList.add("active-pay");
upiBox.classList.remove("active-pay");
upiInfo.style.display="none";
paymentField.value="COD";
}
upiBox.onclick=()=>{
paymentMethod="UPI";
upiBox.classList.add("active-pay");
codBox.classList.remove("active-pay");
upiInfo.style.display="block";
paymentField.value="UPI";
}

// Submit
orderForm.addEventListener("submit",e=>{
e.preventDefault();
if(!paymentMethod){alert("Select payment");return;}

fetch("https://script.google.com/macros/s/AKfycbxisICLhzPNqqXPnFdBcAZkiz2iuLvmoIy-kvbzXf5e4JtVyr7jKpuUldWQT9iWlex4/exec",{
method:"POST",
body:new FormData(orderForm)
})
.then(()=>location.href="thank-you.html")
.catch(()=>alert("Order failed"));
});
</script>
</body>
</html>
